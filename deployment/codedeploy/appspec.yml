
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/notes-app
    overwrite: true

permissions:
  - object: /opt/notes-app
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    type:
      - directory
      - file

hooks:
  ApplicationStop:
    - location: deployment/scripts/stop-application.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: deployment/scripts/install-dependencies.sh
      timeout: 900
      runas: root

  ApplicationStart:
    - location: deployment/scripts/start-application.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: deployment/scripts/validate-application.sh
      timeout: 120
      runas: root


AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Application Load Balancer for the Coditude Notes application.
  Routes frontend traffic to Next.js and API traffic to FastAPI.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from the network stack

Resources:

  # Public Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-notes-alb'
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - Fn::ImportValue:
            !Sub '${EnvironmentName}-PublicSubnetA'
        - Fn::ImportValue:
            !Sub '${EnvironmentName}-PublicSubnetB'
      SecurityGroups:
        - Fn::ImportValue:
            !Sub '${EnvironmentName}-ALB-SecurityGroup'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Target group for Next.js frontend
  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-frontend-tg'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      Matcher:
        HttpCode: '200-399'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Target group for FastAPI backend
  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-backend-tg'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # HTTP listener with frontend as the default target
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # Route Notes API requests to FastAPI
  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /notes
            - /notes/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

Outputs:
  LoadBalancerDNS:
    Description: Public DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-LoadBalancerDNS'

  FrontendTargetGroupArn:
    Description: Target group ARN for Next.js
    Value: !Ref FrontendTargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-FrontendTargetGroupArn'

  BackendTargetGroupArn:
    Description: Target group ARN for FastAPI
    Value: !Ref BackendTargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-BackendTargetGroupArn'


AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Security groups for the Coditude Notes application.
  Controls traffic between the ALB, EC2 application servers,
  and PostgreSQL database.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the VPC created by the network stack

Resources:

  # Security group for the Application Load Balancer
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP traffic
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'
        - Key: Environment
          Value: !Ref EnvironmentName

  # Security group for EC2 application servers
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow application traffic only from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow Next.js traffic from ALB
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow FastAPI traffic from ALB
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-sg'
        - Key: Environment
          Value: !Ref EnvironmentName

  # Security group for PostgreSQL RDS
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL traffic only from application servers
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
          Description: Allow PostgreSQL traffic from application servers
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-database-sg'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  ALBSecurityGroupId:
    Description: Security group ID for the Application Load Balancer
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-ALB-SecurityGroup'

  ApplicationSecurityGroupId:
    Description: Security group ID for EC2 application servers
    Value: !Ref ApplicationSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-Application-SecurityGroup'

  DatabaseSecurityGroupId:
    Description: Security group ID for PostgreSQL database
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-Database-SecurityGroup'
